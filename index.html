<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뉴스 렌즈">
<meta name="theme-color" content="#0B4A33">
<title>뉴스 렌즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 뉴스 렌즈: 출퇴근길 뉴스 비교 에이전트. 콘셉트는 지하철 노선도. */
:root{
  --paper:#F3F5F4; --card:#FFFFFF; --ink:#101826; --sub:#5A6472; --faint:#8D97A3; --rule:#E2E6E9; --soft:#EEF1F0; --tint:#F7F9F8;
  --line:#00A84D; --line-dk:#00773A; --line-soft:#E2F5EA; --line-glow:rgba(0,168,77,.22);
  --warn:#D2432F; --warn-soft:#FDECE8; --warn-ink:#7A2416;
  --note:#FFF4C7; --note-ink:#6B5A00; --amber:#B4570F; --amber-soft:#FDEEDC;
  --link:#1F5FCC; --board:#0D141C; --board-ink:#F4F7F9; --on-ink:#FFFFFF;
  --hero:linear-gradient(150deg,#06321F 0%,#0B5A37 48%,#12925A 100%);
  --shadow-sm:0 1px 2px rgba(16,24,38,.06);
  --shadow:0 1px 2px rgba(16,24,38,.05),0 10px 30px -18px rgba(16,24,38,.28);
  --shadow-lg:0 2px 6px rgba(16,24,38,.06),0 24px 48px -24px rgba(16,24,38,.35);
  --r:22px;
  --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0B1014; --card:#141C22; --ink:#ECF0F3; --sub:#A2ADB8; --faint:#76828E; --rule:#25313A; --soft:#1C262E; --tint:#10171C;
  --line:#22C46C; --line-dk:#62DB9A; --line-soft:#10301E; --line-glow:rgba(34,196,108,.25);
  --warn:#FF7B65; --warn-soft:#3A1C17; --warn-ink:#FFCDC3;
  --note:#3A3317; --note-ink:#F2DE8A; --amber:#F3A55E; --amber-soft:#3A2815;
  --link:#86B7FF; --board:#05080A; --board-ink:#F3F6F8; --on-ink:#0B1014;
  --hero:linear-gradient(150deg,#03170E 0%,#073A23 50%,#0B6B40 100%);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -18px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 48px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.6;font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;transition:background .25s,color .25s}
a{color:var(--link)}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
svg{display:block}

/* ── 상단 바 ── */
.top{position:sticky;top:0;z-index:15;margin:0 -16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.03em;line-height:1.15}
.brand small{display:block;font-size:11.5px;font-weight:500;color:var(--sub);letter-spacing:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.icon-btn{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.icon-btn svg{width:16px;height:16px}
.icon-btn[aria-expanded="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* ── 설정 ── */
.settings{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin-top:6px;display:grid;gap:12px;box-shadow:var(--shadow-lg);animation:rise .25s ease both}
.settings h2{font-size:16px;font-weight:800}
.settings label{display:grid;gap:5px;font-size:12.5px;color:var(--sub);font-weight:600}
.field{border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--tint);color:var(--ink);font-size:14.5px;width:100%;transition:border-color .15s,box-shadow .15s}
.field:focus{outline:0;border-color:var(--line);box-shadow:0 0 0 4px var(--line-glow)}
.settings .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings .chk{display:flex;align-items:center;gap:8px;font-size:13.5px}
.settings .fine{font-size:12px;color:var(--sub)}
.settings .lab{font-size:12.5px;color:var(--sub);font-weight:600}
.lab-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lab-row label{font-size:12.5px;color:var(--sub);font-weight:600}
.lab-row a{font-size:12px;font-weight:700;text-decoration:none}
/* 상단 바: 현재 제공자 표시 */
.top-r{display:flex;align-items:center;gap:6px}
.top-l{display:flex;align-items:center;gap:10px;min-width:0}
.navb{display:flex;align-items:center;gap:4px}
.navb button{height:34px;min-width:34px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;display:inline-grid;grid-auto-flow:column;place-items:center;gap:4px;padding:0 8px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;box-shadow:var(--shadow-sm);transition:opacity .15s,transform .1s}
.navb button svg{width:17px;height:17px}
.navb button:active{transform:scale(.94)}
.navb button:disabled{opacity:.35;cursor:default;box-shadow:none}
.navb .home{padding:0 11px 0 9px}
@media (max-width:430px){.brand>span:last-child{display:none}.top-l{gap:6px}}
@media (max-width:370px){.navb .home span{display:none}.navb .home{padding:0 8px}.brand{display:none}}
.gs{grid-column:1/-1;background:var(--tint);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.gs small{font-size:11.5px;color:var(--sub);line-height:1.5}
.settings .row:has(#effortWrap[hidden]){grid-template-columns:1fr}
.prov-chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 8px 7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm);max-width:130px}
.prov-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prov-chip i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.prov-chip i.ok{background:var(--line)} .prov-chip i.warn{background:var(--amber)}
.prov-chip svg{width:13px;height:13px;color:var(--faint);flex:0 0 auto}
/* 설정 안의 제공자 한 줄 */
.prov-row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"lab lab" "cur go";gap:4px 8px;align-items:center;width:100%;text-align:left;background:var(--tint);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;cursor:pointer}
.prov-row .lab{grid-area:lab}
.prov-row .pr-cur{grid-area:cur;min-width:0}
.prov-row .pr-cur b{display:block;font-size:15px;font-weight:800}
.prov-row .pr-cur small{display:block;font-size:12px;color:var(--sub)}
.prov-row .pr-go{grid-area:go;display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--line-dk)}
.prov-row .pr-go svg{width:15px;height:15px}
.prov-row:hover{border-color:var(--line)}
/* 사이드바 */
.drawer-bg{position:fixed;inset:0;z-index:40;background:rgba(8,12,16,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .2s ease both}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(340px,88vw);background:var(--card);box-shadow:-20px 0 50px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:slidein .26s cubic-bezier(.2,.8,.2,1) both;padding-bottom:env(safe-area-inset-bottom)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--soft)}
.dr-h b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.dr-h small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.dr-x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--sub)}
.dr-x svg{width:16px;height:16px}
.dr-list{flex:1;overflow-y:auto;padding:6px 10px 18px}
.dr-grp{font-size:11.5px;font-weight:700;color:var(--faint);padding:14px 8px 6px}
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 10px;cursor:pointer;transition:background .12s}
.pr:hover{background:var(--tint)}
.pr b{font-size:14.5px;font-weight:700}
.pr small{grid-column:1;font-size:11.5px;color:var(--sub);line-height:1.4}
.pr .st{grid-row:1/3;grid-column:2;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap}
.pr .st i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.pr .st.ok{color:var(--line-dk)} .pr .st.ok i{background:var(--line)}
.pr .st.warn{color:var(--amber)} .pr .st.warn i{background:var(--amber)}
.pr[aria-checked="true"]{background:var(--line-soft)}
.pr[aria-checked="true"] b::after{content:" ✓";color:var(--line-dk)}
@media (max-width:430px){.brand small{display:none}.icon-btn#btnSettings{padding:7px 11px}}
@media (max-width:350px){.prov-chip{max-width:96px}}
.noweb-card{margin-top:14px}
.noweb-card .field{margin-top:10px}
.keyrow{display:flex;gap:8px}
.keyrow .field{flex:1;min-width:0}
.key-save{border:0;border-radius:12px;background:var(--line);color:#fff;font-weight:700;font-size:14px;padding:0 18px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px -8px var(--line);transition:transform .1s}
.key-save:active{transform:scale(.97)}
.key-save.done{background:var(--ink);color:var(--on-ink);box-shadow:none}
.key-state{font-size:12.5px;font-weight:700}
.key-state.warn{color:var(--amber)}
.key-save[disabled]{background:var(--rule);color:var(--faint);box-shadow:none;cursor:wait}
/* 키 점검 패널 */
.kcheck{border:1px solid var(--rule);border-radius:16px;padding:12px 14px;background:var(--tint);display:grid;gap:9px;animation:rise .25s ease both}
.kc-sum{display:grid;grid-template-columns:40px 1fr;gap:11px;align-items:center;border-radius:12px;padding:10px 12px;margin:-2px -4px 2px}
.kc-sum .big{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.kc-sum .big svg{width:22px;height:22px}
.kc-sum b{display:block;font-size:14.5px;font-weight:800}
.kc-sum small{display:block;font-size:12px;opacity:.85}
.kc-sum.run{background:var(--soft)} .kc-sum.run .big{background:var(--faint)}
.kc-sum.ok{background:var(--line-soft);color:var(--line-dk)} .kc-sum.ok .big{background:var(--line);animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.kc-sum.fail{background:var(--warn-soft);color:var(--warn-ink)} .kc-sum.fail .big{background:var(--warn);animation:shake .4s ease both}
.kc-sum.warn{background:var(--amber-soft);color:var(--amber)} .kc-sum.warn .big{background:var(--amber)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.kc-row{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.kc-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--faint);font-size:12px;font-weight:800}
.kc-dot svg{width:14px;height:14px}
.kc-row.run .kc-dot{background:transparent;border:2.5px solid var(--rule);border-top-color:var(--line);animation:spin .8s linear infinite}
.kc-row.ok .kc-dot{background:var(--line);color:#fff}
.kc-row.fail .kc-dot{background:var(--warn);color:#fff}
.kc-row.warn .kc-dot{background:var(--amber);color:#fff}
.kc-row b{display:block;font-size:13px;font-weight:700;line-height:24px}
.kc-row small{display:block;font-size:12px;color:var(--sub);line-height:1.45;margin-top:-2px}
.kc-row.skip b{color:var(--faint)}
.kc-row.fail small{color:var(--warn)}
.kc-foot{font-size:11.5px;color:var(--faint)}
.kdot{width:8px;height:8px;border-radius:50%;margin-left:2px;box-shadow:0 0 0 2px var(--card)}
.kdot.ok{background:var(--line)} .kdot.fail{background:var(--warn)} .kdot.warn{background:var(--amber)}
.key-state.ok{color:var(--line-dk)} .key-state.no{color:var(--warn)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ── 히어로 (1역) ── */
.hero{position:relative;margin:8px 0 0;border-radius:28px;overflow:hidden;background:var(--hero);color:#fff;padding:22px 20px 92px;box-shadow:var(--shadow-lg);isolation:isolate}
.hero .hi{font-size:13px;font-weight:600;opacity:.82;display:flex;align-items:center;gap:6px}
.hero .hi i{width:7px;height:7px;border-radius:50%;background:#7CF0AE;box-shadow:0 0 0 4px rgba(124,240,174,.2)}
.hero h1{font-size:27px;line-height:1.28;font-weight:800;letter-spacing:-.035em;margin-top:8px}
.hero h1 em{font-style:normal;color:#8AF2B6}
.hero p{font-size:13.5px;opacity:.8;margin-top:8px;max-width:22em}
.hero .city{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:-1;pointer-events:none}
.hero .moving{animation:ride 14s linear infinite}
@keyframes ride{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.searchbox{position:relative;margin:-58px 10px 0;z-index:2;background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);padding:8px;display:flex;gap:8px;align-items:center;border:1px solid var(--rule)}
.searchbox svg{width:20px;height:20px;color:var(--faint);margin-left:8px;flex:0 0 auto}
.searchbox input{flex:1;border:0;outline:0;font-size:16px;padding:10px 0;background:transparent;min-width:0}
.searchbox button{border:0;background:var(--line);color:#fff;font-weight:700;border-radius:14px;padding:11px 16px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px -6px var(--line)}
.searchbox button[disabled]{background:var(--rule);color:var(--faint);box-shadow:none;cursor:not-allowed}
.principle{margin:12px 6px 0;font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:flex-start}
.principle svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:var(--line)}

/* ── 섹션 제목 ── */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:28px 2px 12px}
.sec-h h2{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.sec-h h2 small{display:block;font-size:12px;color:var(--sub);font-weight:500;letter-spacing:0;margin-bottom:2px}
.sec-h .act{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.chip-btn{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip-btn svg{width:13px;height:13px}
.chip-btn[disabled]{opacity:.5;cursor:not-allowed}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 오늘의 이슈: 상위 3개 카드 ── */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px;padding:2px 0 0}
.feat::-webkit-scrollbar{display:none}
.fcard{min-width:0;position:relative;overflow:hidden;border:0;text-align:left;border-radius:24px;padding:16px 16px 14px;color:#fff;cursor:pointer;min-height:176px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);background:var(--g);transition:transform .15s}
.fcard:active{transform:scale(.985)}
.fcard[disabled]{cursor:not-allowed;opacity:.7}
.fcard .art-ic{position:absolute;right:-18px;top:-10px;width:132px;height:132px;opacity:.22;color:#fff}
.fcard .rk{font-size:40px;font-weight:900;line-height:1;letter-spacing:-.05em;opacity:.95}
.fcard .cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px;margin-top:10px;align-self:flex-start;backdrop-filter:blur(4px)}
.fcard .cat svg{width:13px;height:13px}
.fcard b{display:block;font-size:18px;font-weight:800;line-height:1.3;letter-spacing:-.03em;margin-top:8px}
.fcard p{font-size:12.5px;opacity:.88;margin-top:4px;line-height:1.5;flex:1}
.fcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;font-weight:700}
.fcard .ft span:last-child{background:#fff;color:#0E3B26;border-radius:999px;padding:4px 11px;white-space:nowrap}
.fcard .ft{gap:6px}
@media (max-width:620px){
  .feat{grid-template-columns:1fr 1fr}
  .feat>:first-child{grid-column:1/-1}
  .feat .fcard:not(:first-child){min-height:0;padding:13px 13px 12px;border-radius:20px}
  .feat .fcard:not(:first-child) .rk{font-size:28px}
  .feat .fcard:not(:first-child) b{font-size:15px}
  .feat .fcard:not(:first-child) p{display:none}
  .feat .fcard:not(:first-child) .art-ic{width:90px;height:90px}
  .feat .fcard:not(:first-child) .ft span:first-child{display:none}
}

/* ── 오늘의 이슈: 4~10위 목록 ── */
.list{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:22px 40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--soft);padding:12px 14px;cursor:pointer;transition:background .15s}
.row:first-child{border-top:0}
.row:hover{background:var(--tint)}
.row[disabled]{cursor:not-allowed;opacity:.6}
.row .n{font-weight:800;font-size:15px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--tb);color:var(--tc)}
.tile svg{width:21px;height:21px}
:root[data-theme="dark"] .tile{background:color-mix(in srgb,var(--tc) 30%,var(--card));color:color-mix(in srgb,var(--tb) 80%,#fff)}
.row b{display:block;font-size:14.5px;font-weight:700;line-height:1.35}
.row .d{display:block;font-size:12.5px;color:var(--sub);line-height:1.45;margin-top:1px}
.cnt-chip{font-size:11.5px;font-weight:700;color:var(--line-dk);background:var(--line-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.foot-note{font-size:11.5px;color:var(--sub);margin:10px 4px 0;display:flex;gap:6px}
.foot-note svg{width:14px;height:14px;flex:0 0 auto;margin-top:2px}
.sk-feat{height:176px;border-radius:24px}
.sk{background:linear-gradient(90deg,var(--soft) 0%,var(--rule) 50%,var(--soft) 100%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{to{background-position:-200% 0}}
.sk-row{display:grid;grid-template-columns:22px 40px 1fr;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--soft)}

.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.h{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.32}
.h small{display:block;font-size:12.5px;color:var(--sub);font-weight:600;letter-spacing:0;margin-bottom:3px}
.sub{color:var(--sub);font-size:13.5px;margin-top:4px}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:15px;padding:15px;cursor:pointer;margin-top:14px;transition:transform .1s,box-shadow .15s}
.btn.primary{background:var(--line);color:#fff;box-shadow:0 10px 22px -10px var(--line)}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--rule);color:var(--faint);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--rule);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:13.5px;margin-top:0;width:auto;display:inline-block;border-radius:12px}
.btn-row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.notice{border-radius:14px;padding:11px 13px;font-size:13px;margin-top:12px;display:flex;gap:9px;align-items:flex-start}
.notice>svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.notice.warn{background:var(--warn-soft);color:var(--warn-ink)}
.notice.warn>svg{color:var(--warn)}
.notice.amber{background:var(--amber-soft);color:var(--amber)}
.notice.info{background:var(--soft);color:var(--sub)}
.notice b{display:block;margin-bottom:1px}
.empty{font-size:13px;color:var(--sub);padding:6px 0}
.pill{font-size:10.5px;border-radius:6px;padding:0 6px;font-weight:700;line-height:19px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pill svg{width:11px;height:11px}
.pill.ok{background:var(--line-soft);color:var(--line-dk)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.pill.sum{background:var(--amber-soft);color:var(--amber)}
.pill.me{background:var(--note);color:var(--note-ink)}
.pill.gray{background:var(--soft);color:var(--sub)}

/* ── 언론사 아바타 (파비콘) ── */
.av{position:relative;display:inline-grid;place-items:center;width:var(--s,28px);height:var(--s,28px);border-radius:30%;background:var(--c);color:#fff;font-weight:800;font-size:calc(var(--s,28px) * .42);flex:0 0 auto;overflow:hidden;box-shadow:0 0 0 2px var(--card)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:14%;opacity:0;transition:opacity .2s}
.av img.ok{opacity:1}
.avs{display:inline-flex}
.avs .av{margin-left:-7px}
.avs .av:first-child{margin-left:0}

/* ── 2역 기사 고르기 ── */
.found{font-size:13.5px;color:var(--sub);margin-top:6px}
.found b{color:var(--ink)}
.art{display:flex;gap:12px;padding:14px;border:1.5px solid var(--rule);border-radius:18px;margin-top:10px;cursor:pointer;background:var(--card);text-align:left;width:100%;transition:border-color .15s,background .15s,box-shadow .15s;position:relative}
.art:hover{box-shadow:var(--shadow)}
.art .ck{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);background:var(--card);transition:background .15s,border-color .15s}
.art[aria-pressed="true"]{border-color:var(--line);background:color-mix(in srgb,var(--line-soft) 60%,var(--card))}
.art[aria-pressed="true"] .ck{background:var(--line);border-color:var(--line)}
.art[aria-pressed="true"] .ck::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.art .bd{flex:1;min-width:0;padding-right:28px}
.art .ol{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.art b.t{display:block;font-size:15px;font-weight:700;line-height:1.42;margin-top:6px;letter-spacing:-.02em}
.art p{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.meta{font-size:11.5px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.addbox{margin-top:14px;border:1.5px dashed var(--rule);border-radius:18px;padding:14px;background:var(--tint);display:grid;gap:10px}
.ab-h{display:flex;gap:10px;align-items:flex-start}
.ab-h>svg{width:22px;height:22px;color:#fff;background:var(--line);border-radius:8px;padding:3px;flex:0 0 auto}
.ab-h b{display:block;font-size:14px}
.ab-h small{font-size:12px;color:var(--sub)}
.ab-row{display:flex;gap:8px}
.ab-row .field{flex:1;min-width:0}
.ab-body{min-height:110px;resize:vertical;font-family:inherit}
.addbox .notice{margin:0}
.paste{margin-top:14px;border:1.5px dashed var(--rule);border-radius:18px;padding:14px;background:var(--tint)}
.paste summary{cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;list-style:none}
.paste summary::-webkit-details-marker{display:none}
.paste summary svg{width:18px;height:18px;color:var(--line)}
.paste .f{display:grid;gap:8px;margin-top:12px}
.paste textarea{min-height:140px;resize:vertical}
.sticky{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));padding:10px 0 4px;background:linear-gradient(transparent,var(--paper) 35%);z-index:5}

/* ── 3역 본문 확인: 달리는 열차 ── */
.journey{position:relative;height:64px;margin:16px 4px 4px}
.journey .trk{position:absolute;left:0;right:0;top:40px;height:6px;border-radius:3px;background:var(--soft)}
.journey .trk i{display:block;height:100%;border-radius:3px;background:var(--line);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.journey .stp{position:absolute;top:35px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--card);border:4px solid var(--rule)}
.journey .stp.on{border-color:var(--line);background:var(--line)}
.journey .train{position:absolute;top:2px;width:76px;margin-left:-38px;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.journey .train.go{animation:bob .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.steps{list-style:none;position:relative;margin-top:12px}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;position:relative}
.steps li::before{content:"";position:absolute;left:17px;top:42px;bottom:-10px;width:2px;background:var(--soft)}
.steps li:last-child::before{display:none}
.steps .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--soft);position:relative}
.steps .st{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;border:2.5px solid var(--card);background:var(--rule)}
.steps .done .st{background:var(--line)}
.steps .done .st::after{content:"";position:absolute;left:4px;top:1.5px;width:3.5px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.steps .run .st{background:var(--line);animation:pulse 1.2s infinite}
.steps .fail .st{background:var(--warn)}
.steps .part .st{background:var(--amber)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--line-glow)}50%{box-shadow:0 0 0 6px var(--line-glow)}}
.steps b{font-size:14px;display:block;font-weight:700}
.steps small{font-size:12.5px;color:var(--sub);display:block;line-height:1.45}
.steps .run b{color:var(--line-dk)}
.steps .wait b{color:var(--faint)}
.tool{display:inline-block;font-size:10.5px;background:var(--soft);border-radius:6px;padding:1px 7px;margin-top:4px;color:var(--sub);font-weight:600}

/* ── 4역 리포트 ── */
.rhead{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;color:#fff;background:var(--g,var(--hero));box-shadow:var(--shadow-lg);margin-top:14px;isolation:isolate}
.rhead .art-ic{position:absolute;right:-22px;bottom:-26px;width:150px;height:150px;opacity:.18;z-index:-1}
.rhead .k{font-size:12px;font-weight:700;opacity:.85;display:flex;gap:6px;align-items:center}
.rhead h1{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.3;margin-top:6px}
.rhead .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rhead .m span{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px}
.rhead .avs{margin-top:12px}
.rhead .av{box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.r-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.r-tools button,.r-tools select{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.r-tools svg{width:15px;height:15px}
.r-tools button[aria-pressed="true"]{background:var(--line);border-color:var(--line);color:#fff}
.board{margin-top:14px;background:var(--board);color:var(--board-ink);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(0,168,77,.22),transparent 60%);pointer-events:none}
.board .lab{font-size:11.5px;font-weight:800;color:#7CF0AE;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.board .lab i{width:6px;height:6px;border-radius:50%;background:#7CF0AE;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.board ol{list-style:none;margin-top:10px;display:grid;gap:9px;counter-reset:l;position:relative}
.board li{counter-increment:l;display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14.5px;line-height:1.55}
.board li::before{content:counter(l);width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.12);font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.sec{margin-top:16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow)}
.sec>h3{font-size:15.5px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec>h3 .hic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--line-soft);color:var(--line-dk);flex:0 0 auto}
.sec>h3 .hic svg{width:16px;height:16px}
.sec>h3 small{margin-left:auto;font-weight:500;color:var(--sub);font-size:11.5px;text-align:right}
.fact{border-top:1px solid var(--soft)}
.fact:first-of-type{border-top:0}
.fact>button{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;font-size:14px;width:100%;background:none;border:0;text-align:left;cursor:pointer;align-items:center}
.fact .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);margin-top:6px}
.fact .who em{font-style:normal;color:var(--link);font-weight:700}
.cnt{font-size:11.5px;font-weight:800;color:var(--line-dk);background:var(--line-soft);border-radius:999px;padding:0 9px;height:24px;line-height:24px}
.cnt.part{color:var(--amber);background:var(--amber-soft)}
.evid{display:grid;gap:6px;padding:0 0 12px}
.evid div{font-size:12.5px;background:var(--tint);border-radius:12px;padding:9px 11px;border:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
.evid div b{display:block;font-size:11.5px}
.evid p{font-size:11.5px;color:var(--sub)}
.tone{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);gap:2px}
.tone i{display:block;border-radius:3px}
.tone-l{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.tone-l span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.tone-who{display:grid;gap:8px;margin-top:12px}
.tone-who>div{display:grid;grid-template-columns:auto 1fr;gap:9px;font-size:12.5px;align-items:start}
.tone-who .tg{font-size:10.5px;font-weight:800;border-radius:6px;padding:0 6px;margin-left:4px;color:#fff;background:var(--c)}
.oc{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:12px 0;border-top:1px solid var(--soft)}
.oc:first-of-type{border-top:0;padding-top:4px}
.oc .t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oc b{font-size:14.5px}
.oc .f{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.oc p{font-size:13.5px;margin-top:4px;color:var(--ink);opacity:.88}
.oc q{display:block;font-size:12.5px;color:var(--sub);margin-top:7px;padding-left:10px;border-left:3px solid var(--rule);quotes:"“" "”"}
.oc .sp{font-size:11.5px;color:var(--faint);padding-left:13px}
.iss{border:1px solid var(--rule);border-radius:16px;padding:12px 13px;margin-top:8px;background:var(--tint)}
.iss:first-of-type{margin-top:0}
.iss>b{font-size:14px;display:block;margin-bottom:6px}
.iss div{font-size:13px;padding:4px 0;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
.hl{font-size:14px;padding:10px 0;border-top:1px solid var(--soft);line-height:1.75;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.hl:first-of-type{border-top:0}
.hl mark{background:color-mix(in srgb,var(--c) 18%,transparent);color:inherit;font-weight:800;border-radius:4px;padding:0 2px}
.hl .sh{color:var(--faint)}
.hl-legend{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.hl-legend mark{background:var(--soft);font-weight:800;color:var(--ink);border-radius:4px;padding:0 3px}
.only{font-size:13.5px;padding:8px 0;border-top:1px solid var(--soft);display:grid;grid-template-columns:auto 1fr;gap:9px}
.only:first-of-type{border-top:0}
.links{display:grid;gap:8px}
.links a,.links>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;text-decoration:none;border:1px solid var(--rule);border-radius:14px;padding:10px 12px;color:var(--ink);transition:background .15s}
.links a:hover{background:var(--tint)}
.links .go{color:var(--link);flex:0 0 auto}
.links .go svg{width:17px;height:17px}
.links .lt{min-width:0}
.links .lt b{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:12px}
.cautions{list-style:none;display:grid;gap:7px}
.cautions li{font-size:13px;color:var(--sub);display:grid;grid-template-columns:16px 1fr;gap:7px}
.cautions li svg{width:15px;height:15px;color:var(--amber);margin-top:2px}
.neutral{margin-top:14px;font-size:12px;color:var(--sub);display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--soft)}
.neutral svg{width:18px;height:18px;flex:0 0 auto;color:var(--line)}
.ask{display:flex;gap:8px;margin-top:2px}
.ask input{flex:1;min-width:0}
.qa{margin-top:12px;display:grid;gap:12px}
.qa .q{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.qa .q::before{content:"Q";width:20px;height:20px;border-radius:7px;background:var(--line);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.qa .a{font-size:13.5px;background:var(--tint);border:1px solid var(--rule);border-radius:4px 16px 16px 16px;padding:11px 13px;margin:6px 0 0 28px}
.qa .a.no{color:var(--sub)}
.rmenu-h{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
.rmenu-h b{font-size:15px} .rmenu-h small{font-size:12px;color:var(--sub)}
.rmenu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rmenu button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:16px;padding:11px 11px 10px;cursor:pointer;font:inherit;min-width:0;transition:transform .1s,border-color .15s,background .15s}
.rmenu button:active{transform:scale(.97)}
.rmenu button svg{width:20px;height:20px;color:var(--line-dk);margin-bottom:4px}
.rmenu button b{font-size:13px;line-height:1.25;word-break:keep-all}
.rmenu button small{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rmenu button[aria-selected="true"]{background:var(--line);border-color:var(--line);color:#fff;box-shadow:0 8px 18px -10px var(--line)}
.rmenu button[aria-selected="true"] svg,.rmenu button[aria-selected="true"] small{color:#fff}
.rmenu button.new::after{content:"NEW";position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;color:#fff;background:var(--warn);border-radius:5px;padding:1px 4px}
.rpanel{margin-top:10px}
.rpanel>.sec{margin-top:0}
.rp-close{display:flex;align-items:center;gap:4px;margin:8px auto 0;border:0;background:none;color:var(--sub);font:inherit;font-size:12.5px;cursor:pointer;padding:6px 10px}
.rp-close svg{width:14px;height:14px}
@media (max-width:360px){.rmenu{grid-template-columns:repeat(2,1fr)}}
.cm-lead{font-size:13.5px;color:var(--sub);margin:0 0 10px}
.cm .btn.primary svg{width:18px;height:18px;margin-right:6px;vertical-align:-3px}
.cm-manual,.cm-more{margin-top:12px;border:1px solid var(--rule);border-radius:14px;padding:9px 12px;background:var(--card)}
.cm-manual summary,.cm-more summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:700}
.cm-manual[open] summary,.cm-more[open] summary{margin-bottom:8px}
.cm-from{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.cm-from svg{width:14px;height:14px;flex:none;margin-top:2px}
.cm-from b{color:var(--ink)}
.cm-miss{display:flex;gap:6px;font-size:12px;color:var(--sub);margin:-2px 0 10px}
.cm-miss svg{width:14px;height:14px;flex:none;margin-top:1px}
.pick-all{font-style:normal;font-size:11.5px;font-weight:800;color:var(--line-dk);background:var(--line-soft);border-radius:99px;padding:2px 8px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.cm-howto{margin:4px 0 10px;padding-left:20px;font-size:13px;display:grid;gap:7px}
.cm-howto small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.cm-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.cm-links a{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--rule);background:var(--card);border-radius:99px;padding:3px 9px 3px 4px}
.cm .btn.primary{width:100%;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px}
.cm .btn.primary svg{display:inline-block;flex:none;margin:0!important}
.cm-none{display:flex;gap:11px;border:1px solid var(--rule);background:var(--tint);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.cm-none>svg{width:26px;height:26px;flex:none;color:var(--sub);margin-top:1px}
.cm-none b{display:block;font-size:14.5px}
.cm-none p{font-size:13px;color:var(--sub);margin:4px 0 0}
.cm-none ul{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:5px}
.cm-none li{display:flex;align-items:center;gap:7px;font-size:13px}
.cm-none li span{flex:1;min-width:0}
.cm-none li em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--sub);background:var(--card);border:1px solid var(--rule);border-radius:99px;padding:2px 8px}
.cm-none .cm-tip{font-size:12px;margin-top:9px}
.cm-h .cm-num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:var(--line);color:#fff;font-size:12px;margin-right:6px;vertical-align:1px}
.cm-h{color:var(--ink)!important;font-size:14px!important}
.cm-h small{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.cm-best .cm-check{margin-top:6px}
.cm-mini{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--sub);margin-top:5px}
.cm-same{color:var(--sub);font-size:12px}
.cm-note{display:flex;gap:6px;font-size:12.5px;color:var(--sub);margin:10px 0 0}
.cm-note svg{width:14px;height:14px;flex:none;margin-top:2px}
.cm-lead b{color:var(--ink)}
.cm-in{width:100%;min-height:120px;resize:vertical;font-size:13px;line-height:1.55;font-family:inherit}

.cm-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-size:14px}

.cm-v{display:flex;gap:7px;align-items:center}

.cm-check p{margin:6px 0 0;font-size:13px}
.cm-check .warnline,.cm-card .warnline{color:var(--warn);font-size:12px}
.cm-src{display:grid;gap:4px;margin-top:7px}

<script id="agent-core">
(function (root) {
  'use strict';
  var API_URL = 'https://api.openai.com/v1/responses';
  var DEFAULTS = { model: 'gpt-5.4', effort: 'low', maxTokens: 8192 };

  /* ---------- 출력 형식(JSON Schema) ---------- */
  var S = { str: { type: 'string' }, strArr: { type: 'array', items: { type: 'string' } } };
  function obj(props) { return { type: 'object', properties: props, required: Object.keys(props), additionalProperties: false }; }
  function arr(items) { return { type: 'array', items: items }; }
  var SCHEMA = {
    briefing: obj({ issues: arr(obj({ topic: S.str, query: S.str, category: S.str, facts: S.strArr, point: S.str,
      views: arr(obj({ outlet: S.str, angle: S.str, tone: { type: 'string', enum: ['긍정', '중립', '우려'] }, url: S.str })) })) }),
    trending_topics: obj({
      topics: arr(obj({ topic: S.str, query: S.str, category: S.str, summary: S.str, headline: S.str, url: S.str, points: S.strArr, outlets: S.strArr })),
      note: S.str
    }),

  /* ---------- ⓪ 오늘 많이 보도된 이슈 TOP 10 ---------- */

    if (!got.length && firstErr) throw firstErr;
    var issues = merge();
    if (!issues.length) throw new Error('간밤 이슈를 찾지 못했습니다. 잠시 후 다시 시도해 주세요.');
    return { issues: issues, at: Date.now(), demo: demo, when: when, parts: groups.length, searches: searches, verified: verifiedAll, dropped: droppedAll,
      spreadAvg: issues.length ? Math.round(issues.reduce(function (a, x) { return a + x.spread; }, 0) / issues.length * 10) / 10 : 0,
      wireShare: (function () { var n = 0, w = 0; issues.forEach(function (x) { x.views.forEach(function (v) { n++; if (v.lean === '통신') w++; }); }); return n ? Math.round(w / n * 100) : 0; })(),
      note: fails.length ? fails.join(', ') + ' 분야는 불러오지 못했어요.' : '' };
  }

  /* ---------- ① 기사 수집 ---------- */
  async function collect(cfg, issue, log) {

    ].join('\n');

    var d = r.data || {}, seen = {};
    var list = (Array.isArray(d.articles) ? d.articles : []).filter(function (a) {

        id: 'c' + i, outlet: String(a.outlet || '언론사 미상').trim(), title: String(a.title).trim(), url: String(a.url).trim(),

  }

  // 기사 주소의 도메인으로 언론사 이름을 추정한다 (모르면 도메인 그대로, 본문 확인 때 실제 이름으로 바뀐다)
  var OUTLET_HOST = { 'chosun.com': '조선일보', 'joongang.co.kr': '중앙일보', 'donga.com': '동아일보', 'hani.co.kr': '한겨레', 'khan.co.kr': '경향신문', 'yna.co.kr': '연합뉴스', 'hankookilbo.com': '한국일보', 'mk.co.kr': '매일경제', 'hankyung.com': '한국경제', 'kbs.co.kr': 'KBS', 'imbc.com': 'MBC', 'sbs.co.kr': 'SBS', 'jtbc.co.kr': 'JTBC', 'ytn.co.kr': 'YTN', 'news1.kr': '뉴스1', 'newsis.com': '뉴시스', 'ohmynews.com': '오마이뉴스', 'segye.com': '세계일보', 'seoul.co.kr': '서울신문', 'munhwa.com': '문화일보', 'kmib.co.kr': '국민일보', 'sedaily.com': '서울경제', 'edaily.co.kr': '이데일리', 'mt.co.kr': '머니투데이', 'nocutnews.co.kr': '노컷뉴스', 'pressian.com': '프레시안', 'mbn.co.kr': 'MBN', 'ichannela.com': '채널A', 'tvchosun.com': 'TV조선', 'news.naver.com': '네이버 뉴스', 'v.daum.net': '다음 뉴스' };
  function outletOfUrl(u) {

  /* ---------- ② 언론사 이름으로 기사 1건 찾기 ---------- */
  async function findByOutlet(cfg, issue, outlet, log) {
    var instructions = [
      '너는 특정 언론사의 기사를 찾는 수집 담당이다. 오늘 날짜는 ' + today() + '이다.',

      '- url은 검색 도구가 실제로 보여준 개별 기사 원문 주소만. 주소를 추측하거나 만들어내지 마라.',
      '- 최근 기사를 우선한다. published는 YYYY-MM-DD(모르면 빈 문자열), snippet은 기사가 전한 내용 한 문장(80자 이내).',
      '- issue_label은 이슈 이름 그대로.'
    ].join('\n');
    var r = await callOpenAI(cfg, { instructions: instructions, input: '이슈: ' + issue + '\n언론사: ' + outlet, tools: WEB_TOOL, schemaName: 'news_candidates' }, '② 언론사로 찾기 · ' + outlet, log);
    var want = normOutlet(outlet);
    var a = (Array.isArray(r.data.articles) ? r.data.articles : []).filter(function (x) {
      var n = normOutlet(x && x.outlet);
      return x && isHttp(x.url) && x.title && n && (n.indexOf(want) >= 0 || want.indexOf(n) >= 0);
    })[0];
    if (!a) return { article: null, note: String(r.data.note || '') };
    return { article: { id: 'o' + Date.now(), outlet: String(a.outlet).trim(), title: String(a.title).trim(), url: String(a.url).trim(), published: String(a.published || '').trim(), snippet: String(a.snippet || '').trim(), verified: verifyUrl(a.url, r.sources), pasted: false, added: true }, note: '' };
  }

  // 기사 URL이 검색 도구가 실제로 확인한 출처 목록에 있는지 대조
  function verifyUrl(url, sources) {
    var n = normUrl(url);
    if (!n || !sources || !sources.size) return false;
    if (sources.has(n)) return true;
    var base = n.split('?')[0], hit = false;
    if (base.split('/').length > 2) sources.forEach(function (s) { if (!hit && s.split('?')[0] === base) hit = true; });
    if (hit) return true;
    // 원문 주소를 주지 않는 제공자(Gemini)는 검색에서 확인된 도메인과만 대조한다 → 'domain'
    var h = hostOfUrl(url), dom = false;
    if (h) sources.forEach(function (s) {
      if (dom || s.indexOf('domain:') !== 0) return;
      var d = s.slice(7);
      if (h === d || h.slice(-(d.length + 1)) === '.' + d || d.slice(-(h.length + 1)) === '.' + h) dom = true;
    });
    return dom ? 'domain' : false;
  }

  /* ---------- ③ 본문 확인 (기사 1건) ---------- */
  async function extract(cfg, article, log) {
    var base = [
      '너는 기사 한 건의 내용을 정리하는 담당이다. 판단하지 말고 기사에 적힌 것만 옮긴다.',
      '규칙:',
      '- 기사에 없는 사실, 배경지식, 수치를 추가하지 마라.',
      '- facts: 기사가 전한 사실(누가, 무엇을, 언제, 수치) 3~6개. 각 60자 이내. 해석이나 평가는 넣지 마라.',
      '- emphasis: 이 기사가 가장 앞세운 내용이나 시각을 한 문장으로.',
      '- quotes: 기사 속 발언 최대 3개. speaker는 발언자(직함 포함), quote는 40자 이내로 짧게 줄인다. 없으면 빈 배열.',

      instructions = base.concat(['- 사용자가 붙여넣은 본문만 근거로 한다. accessible은 true, basis는 "본문", fail_reason은 빈 문자열.']).join('\n');
      input = '언론사: ' + article.outlet + '\n제목: ' + article.title + '\n\n[본문]\n' + String(article.body || '').slice(0, 12000);
    } else {
      instructions = base.concat([
        '- 웹 검색 도구로 아래 기사 주소를 직접 열어 읽어라. 같은 주소의 기사만 다룬다. 다른 언론사 기사나 다른 기사로 대체하지 마라.',
        '- 본문을 읽었으면 accessible=true, basis="본문".',
        '- 본문은 열지 못했지만 검색 결과에서 이 기사의 요약을 확인했으면 accessible=true, basis="검색요약"으로 하고, 그 요약에 있는 내용만 쓴다.',

      ]).join('\n');
      input = '언론사: ' + article.outlet + '\n제목: ' + article.title + '\n주소: ' + article.url + (article.added && article.issue ? '\n이슈: ' + article.issue : '');
      tools = WEB_TOOL;

    var r = await callOpenAI(cfg, { instructions: instructions, input: input, tools: tools, schemaName: 'article_extract', model: cfg.lightModel || '' }, '③ 본문 확인 · ' + article.outlet, log);
    var d = r.data || {};
    var facts = (Array.isArray(d.facts) ? d.facts : []).map(String).filter(Boolean).slice(0, 8);
    var accessible = !!d.accessible && facts.length > 0;
    return {
      id: article.id, outlet: article.userUrl && d.outlet ? String(d.outlet).trim() : article.outlet, title: article.userUrl && d.title ? String(d.title).trim() : article.title, url: article.url, userUrl: !!article.userUrl,

      facts: facts,

      quotes: (Array.isArray(d.quotes) ? d.quotes : []).filter(function (q) { return q && q.quote; }).slice(0, 3),
      tone: ['긍정', '중립', '우려'].indexOf(d.tone) >= 0 ? d.tone : '중립',

      failReason: String(d.fail_reason || ''),
      searches: r.searches
    };
  }

  // 비교에 들어가는 기사 사실에 번호를 붙인다. "2-3" = 두 번째 기사의 세 번째 사실
  function packFacts(extracts) {
    return extracts.map(function (e, i) {
      return {
        outlet: e.outlet, title: e.title, published: e.published,
        basis: e.basis === '검색요약' ? '검색 요약만 확인' : '본문 확인',
        facts: e.facts.map(function (f, j) { return { id: (i + 1) + '-' + (j + 1), text: f }; }),
        emphasis: e.emphasis, quotes: e.quotes, tone: e.tone
      };
    });
  }

  /* ---------- ④ 비교 분석 ---------- */
  async function compare(cfg, issue, extracts, log) {
    var outlets = extracts.map(function (e) { return e.outlet; });
    var instructions = [
      '너는 같은 이슈를 다룬 여러 언론사 기사를 비교하는 담당이다.',
      '원칙: 어느 쪽이 옳은지 판단하지 않고 차이만 보여준다. 아래 기사 정리에 없는 내용은 절대 추가하지 않는다.',
      '비교 대상 언론사는 정확히 다음과 같다: ' + outlets.join(', ') + '. 언론사명은 이 표기 그대로만 쓰고, 다른 언론사를 언급하지 마라.',
      '각 사실에는 id가 붙어 있다(예: "2-3"은 두 번째 기사의 세 번째 사실).',
      '출력 규칙:',
      '- three_lines: 출퇴근길에 먼저 읽을 요약 3줄. 1줄은 공통으로 전한 핵심 사실, 2~3줄은 언론사별 강조점 차이. 각 70자 이내.',
      '- common_facts: 2개 이상 언론사의 사실이 같은 내용을 말하는 경우만. fact는 구체적으로(누가, 무엇을, 수치) 쓰고, "흐름을 다뤘다"처럼 막연한 주제 요약은 넣지 마라. refs에는 그 내용을 담은 사실 id를 언론사마다 하나 이상 적는다. 같은 내용이 아닌 사실의 id를 넣지 마라.',
      '- outlet_views: 언론사마다 1개. focus는 강조점을 6~12자 꼬리표로, view는 관점을 한 문장으로.',
      '- issues: 언론사 사이에 다루는 방식이 갈리는 쟁점 1~3개. positions에 언론사별로 어떻게 다뤘는지 한 문장씩. 다루지 않은 언론사는 "다루지 않음".',
      '- only_some: 한 언론사만 다룬 내용 중 이슈 이해에 중요한 것 최대 5개. 비슷한 수치는 한 항목으로 묶는다. refs에 근거 사실 id.',
      '- cautions: 독자가 알아야 할 한계(예: 요약만 확인한 기사, 기사 수가 적음, 날짜 차이, 기사들이 서로 다른 사건을 다룸). 없으면 빈 배열.',
      '- 기사 문장을 길게 그대로 옮기지 말고 짧게 요약한다.'
    ].join('\n');
    var input = '이슈: ' + issue + '\n\n기사 정리(JSON):\n' + JSON.stringify(packFacts(extracts), null, 1);
    var r = await callOpenAI(cfg, { instructions: instructions, input: input, schemaName: 'news_compare_report', maxTokens: extracts.length > 4 ? 16000 : 0, model: cfg.lightModel || '' }, '④ 비교 분석', log);
    return r.data || {};
  }

  /* ---------- 근거 번호 해석 ---------- */
  function factMap(extracts) {
    var m = {};
    extracts.forEach(function (e, i) { e.facts.forEach(function (f, j) { m[(i + 1) + '-' + (j + 1)] = { id: (i + 1) + '-' + (j + 1), outlet: e.outlet, text: f }; }); });
    return m;
  }
  function resolveRefs(refs, fmap) {
    var out = [], seen = {}, total = 0;
    (Array.isArray(refs) ? refs : []).forEach(function (r) {
      total++;
      var mm = String(r || '').match(/(\d+)\s*-\s*(\d+)/);
      var k = mm ? mm[1] + '-' + mm[2] : '';
      if (k && fmap[k] && !seen[k]) { seen[k] = 1; out.push(fmap[k]); }
    });
    return { list: out, total: total, valid: out.length };
  }
  function outletsOf(evid) { var o = []; evid.forEach(function (e) { if (o.indexOf(e.outlet) < 0) o.push(e.outlet); }); return o; }

  /* ---------- 결과 점검(환각 방지) ---------- */
  // extracts: 비교에 들어간 기사, others: 후보에는 있었지만 고르지 않은 언론사명
  function checkReport(rep, extracts, others) {
    rep = rep || {};
    var selected = extracts.map(function (e) { return e.outlet; });
    var fmap = factMap(extracts);
    var selN = {}; selected.forEach(function (o) { selN[normOutlet(o)] = o; });
    function canon(o) {
      var n = normOutlet(o);
      if (!n) return null;
      if (selN[n]) return selN[n];
      var hit = null;
      Object.keys(selN).forEach(function (k) { if (!hit && k && (k.indexOf(n) >= 0 || n.indexOf(k) >= 0)) hit = selN[k]; });
      return hit;
    }
    var strange = {}, refTotal = 0, refValid = 0, dropped = 0;
    function mark(o) { if (String(o || '').trim()) strange[String(o).trim()] = 1; }
    // 공통 사실: 언론사는 모델 주장 대신 근거 id에서 다시 계산하고, 2곳 미만이면 뺀다
    var common = (Array.isArray(rep.common_facts) ? rep.common_facts : []).map(function (f) {
      var r = resolveRefs(f && f.refs, fmap);
      refTotal += r.total; refValid += r.valid;
      return { fact: String(f && f.fact || ''), evidence: r.list, outlets: outletsOf(r.list) };
    }).filter(function (f) { var ok = f.fact && f.outlets.length >= 2; if (!ok) dropped++; return ok; });
    var views = (Array.isArray(rep.outlet_views) ? rep.outlet_views : []).map(function (v) {
      var c = canon(v && v.outlet); if (!c && v) mark(v.outlet);
      return c ? { outlet: c, focus: String(v.focus || ''), view: String(v.view || '') } : null;
    }).filter(Boolean);
    var issues = (Array.isArray(rep.issues) ? rep.issues : []).map(function (i) {
      return {
        topic: String(i && i.topic || ''),
        positions: (Array.isArray(i && i.positions) ? i.positions : []).map(function (p) {
          var c = canon(p && p.outlet); if (!c && p) mark(p.outlet);
          return c ? { outlet: c, stance: String(p.stance || '') } : null;
        }).filter(Boolean)
      };

  /* ----- 3역: 본문 확인 (열차가 노선을 달림) ----- */

    var s = st.startedAt ? Math.round(((st.busy ? Date.now() : st.startedAt + st.reportMs) - st.startedAt) / 1000) : 0;
    h += '<p class="sub" id="elapsed">' + (st.busy ? s + '초 경과 · ' + (st.selected.length > 4 ? '기사를 4건씩 동시에 읽습니다' : '기사는 동시에 읽습니다') : st.reportMs ? '걸린 시간 ' + sec(st.reportMs) : '') + '</p>';
    h += '<div class="journey" aria-hidden="true"><div class="trk"><i style="width:' + Math.round(pct * 100) + '%"></i></div>';

  }

  function wkey(w) {
    var k = String(w).replace(/[^\p{L}\p{N}%.]/gu, '').replace(/^\.+|\.+$/g, '').toLowerCase();

    var cat = st.category;
    reset(); st.fromArchive = false; st.category = cat;
    st.issue = issue; st.draft = issue; st.busy = true; st.tab = 'flow'; st.step = 1;
    st.collectStart = Date.now(); st.collectExp = collectExpect();
    render(); window.scrollTo({ top: 0 }); // 어디서 눌렀든 진행 막대가 바로 보이게 맨 위로
    clearInterval(collectTimer); collectTimer = setInterval(collectTick, 250);
    var t0 = Date.now(), pf = perfStart('collect', issue);
    try {
      var res = await Core.collect(cfg(), issue, log);
      perfEnd(pf, res.articles.length >= 2, { items: res.articles.length, verified: res.articles.filter(function (a) { return a.verified; }).length });
      st.collectMs = Date.now() - t0;
      st.issueLabel = res.issueLabel; st.note = res.note; st.candidates = res.articles;
      res.articles.forEach(function (a) { color(a.outlet); });
      // 기본 선택: 출처 확인된, 서로 다른 언론사 앞쪽 3건
      // 기본 선택: 출처가 확인된 기사 가운데 성향이 서로 다른 3곳(관점 비교가 목적)
      var picked = {}, pool2 = res.articles.filter(function (a) { var k = Core.normOutlet(a.outlet); if (!a.verified || picked[k]) return false; picked[k] = 1; return true; });
      st.selected = Core.diversify(pool2, 3).map(function (a) { return a.id; });
      st.busy = false; st.reached = 2; st.step = 2;
      log({ stage: '① 결과', ok: true, note: '후보 ' + res.articles.length + '건 · 출처 확인 ' + res.articles.filter(function (a) { return a.verified; }).length + '건' });
      saveRecent(issue, res.issueLabel);
    } catch (e) { st.busy = false; st.error = e.message; if (pf) { perfEnd(pf, false, { err: String(e.message || e).slice(0, 90) }); pf = null; } }
    clearInterval(collectTimer); collectTimer = null;
    render(); window.scrollTo({ top: 0 });
  }

  var ticker = null;
  async function runCompare() {
    if (st.busy) return;
    if (needKey()) { st.error = 'API 키가 없습니다. 설정에서 키를 입력해 주세요.'; render(); return; }
    var c = cfg();
    var sel = st.selected.map(byId).filter(Boolean);
    if (sel.length < 2) return;
    if (!webOK() && sel.some(function (a) { return !a.pasted; })) {
      st.error = P().name + '은(는) 웹 검색이 없어 기사를 직접 열 수 없습니다. 본문을 붙여넣은 기사만 골라 주세요. (붙여넣지 않은 기사 ' + sel.filter(function (a) { return !a.pasted; }).length + '건 선택됨)';
      softRender(); return;
    }
    st.providerUsed = P().name + ' · ' + (cfgModel.value.trim() || P().model);
    var tok0 = tally.tokens, calls0 = tally.calls, pf = perfStart('report', st.issueLabel);
    st.busy = true; st.error = null; st.report = null; st.extracts = []; st.compareState = 'wait'; st.progress = {}; st.qa = []; st.openFacts = {}; st.ttsWarn = '';
    st.step = 3; st.reached = 3; st.startedAt = Date.now(); st.reportMs = 0;
    sel.forEach(function (a) { st.progress[a.id] = { state: 'run' }; });
    render(); window.scrollTo({ top: 0 });
    ticker = setInterval(function () { var el = $('elapsed'); if (el && st.busy) el.textContent = Math.round((Date.now() - st.startedAt) / 1000) + '초 경과 · ' + (st.selected.length > 4 ? '기사를 4건씩 동시에 읽습니다' : '기사는 동시에 읽습니다'); }, 1000);
    try {
      // ③ 본문 확인: 고른 기사를 4건씩 동시에 처리 (많이 골라도 요청이 한꺼번에 몰리지 않게)
      var results = await pool(sel, 4, function (a) {
        return Core.extract(c, a, log).then(function (x) {
          perfFirst(pf);
          st.progress[a.id] = { state: !x.accessible ? 'fail' : x.basis === '검색요약' ? 'part' : 'ok', n: x.facts.length, reason: x.failReason };
          if (st.step === 3 && st.tab === 'flow') softRender();
          return x;
        }).catch(function (err) {
          st.progress[a.id] = { state: 'fail', reason: err.message.slice(0, 60) };
          if (st.step === 3 && st.tab === 'flow') softRender();
          return { id: a.id, outlet: a.outlet, title: a.title, url: a.url, published: a.published, verified: a.verified, pasted: a.pasted, accessible: false, basis: '없음', facts: [], emphasis: '', quotes: [], tone: '중립', toneReason: '', failReason: err.message };
        });
      });
      st.extracts = results;
      var ok = results.filter(function (x) { return x.accessible; });
      if (ok.length < 2) { st.compareState = 'fail'; throw new Error('내용을 확인한 기사가 ' + ok.length + '건뿐이라 비교할 수 없습니다. 다른 기사를 고르거나 본문을 직접 붙여넣어 주세요.'); }
      // ④ 비교 분석 + 근거 점검
      st.compareState = 'run'; if (st.tab === 'flow') softRender();
      var raw = await Core.compare(c, st.issueLabel, ok, log);
      var selectedOutlets = ok.map(function (x) { return x.outlet; });
      var others = st.candidates.map(function (x) { return x.outlet; }).filter(function (o) { return selectedOutlets.indexOf(o) < 0; });
      st.report = Core.checkReport(raw, ok, others);
      var rp = st.report;
      log({ stage: '④ 점검', ok: !rp.strangeOutlets.length, note: '공통 사실 ' + rp.commonFacts.length + '개 · 근거 연결 ' + rp.refValid + '/' + rp.refTotal + (rp.droppedCommon ? ' · 제외 ' + rp.droppedCommon : '') + (rp.strangeOutlets.length ? ' · 선택 외 언론사 ' + rp.strangeOutlets.length : '') });
      st.compareState = 'done';
      st.reportMs = Date.now() - st.startedAt;
      st.reportTime = '오늘 ' + hm(Date.now()) + ' 생성';
      st.runId = 'r' + Date.now();
      var np = results.filter(function (x) { return !x.pasted; });
      var kl = kpiList();
      kl.unshift({
        id: st.runId, at: Date.now(), issue: st.issueLabel, collectMs: st.collectMs, compareMs: st.reportMs,
        selected: results.length, nonPasted: np.length, bodyOk: np.filter(function (x) { return x.accessible && x.basis === '본문'; }).length,
        summaryOnly: results.filter(function (x) { return x.accessible && x.basis === '검색요약'; }).length, failed: results.filter(function (x) { return !x.accessible; }).length,
        candTotal: st.candidates.filter(function (x) { return !x.pasted; }).length, candVerified: st.candidates.filter(function (x) { return x.verified; }).length,
        commonFacts: rp.commonFacts.length, droppedCommon: rp.droppedCommon, refValid: rp.refValid, refTotal: rp.refTotal, strangeOutlets: rp.strangeOutlets.length,
        readSec: null, rating: null, tokens: tally.tokens - tok0, calls: tally.calls - calls0, provider: st.providerUsed
      });
      lsSet(LS.kpi, JSON.stringify(kl.slice(0, 200)));
      perfEnd(pf, true, { items: results.length, bodyOk: results.filter(function (x) { return x.accessible; }).length, refValid: rp.refValid, refTotal: rp.refTotal });
      saveArchive();
      st.busy = false; st.reached = 4; st.step = 4; st.reportShownAt = Date.now();
    } catch (e) {
      if (st.compareState === 'run') st.compareState = 'fail';
      st.busy = false; st.error = e.message; st.reportMs = Date.now() - st.startedAt;
      perfEnd(pf, false, { items: sel.length, err: String(e.message || e).slice(0, 90) });
    }
    clearInterval(ticker);
    if (st.tab === 'flow') { render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } else renderTabs();
  }

  async function runFollowup(q) {
    q = String(q || '').trim();
    if (!q || st.qaBusy) return;
    if (needKey()) { st.qaError = 'API 키가 없습니다. 설정에서 키를 입력해 주세요.'; softRender(); return; }
    st.qaBusy = true; st.qaError = null; softRender();
    var draft = q, pf = perfStart('qa', q);
    try {
      var ok = st.extracts.filter(function (x) { return x.accessible; });
      var a = await Core.followup(cfg(), st.issueLabel, ok, q, log);
      perfEnd(pf, true, { answerable: !!a.answerable, refs: a.evidence.length });
      st.qa.unshift(a); draft = '';
      if (st.runId) saveArchiveQa();
    } catch (e) { st.qaError = e.message; perfEnd(pf, false, { err: String(e.message || e).slice(0, 90) }); }
    st.qaBusy = false; softRender();
    var inp = $('inAsk'); if (inp && draft) inp.value = draft;
  }
  function saveArchiveQa() {
    var list = lsJson(LS.archive, []);
    list.forEach(function (a) { if (a.id === st.runId) { a.qa = st.qa; a.cm = st.cm; } });
    lsSet(LS.archive, JSON.stringify(list));
  }

  function saveRecent(issue, label) {
    var list = lsJson(LS.recent, []).filter(function (r) { return r.issue !== issue; });
    list.unshift({ issue: issue, label: label, when: mdhm(Date.now()) });
    lsSet(LS.recent, JSON.stringify(list.slice(0, 6)));
  }

  window.addEventListener('beforeunload', stopSpeak);
  // 디버그·검증용: 상태를 주입해 화면을 그릴 수 있게 노출
  window.NewsLensUI = { state: st, render: render, go: go, titleCompare: titleCompare, kpiList: kpiList };
  st.trend = trendCached();
  render();
  maybeLoadTrend();
})();
</script>
</body>
